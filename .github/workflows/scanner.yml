name: EGX Scanner

# Yahoo publishes the EGX end-of-day bar a few hours after the 14:30 Cairo
# close, so we run in the evening and once more before the next open as a
# safety net. Every run is idempotent: it only commits when the data changed,
# so extra runs cost nothing.
on:
  schedule:
    - cron: "0 16 * * *"   # 19:00 Cairo (DST) / 18:00 (winter)
    - cron: "30 19 * * *"  # 22:30 Cairo (DST) / 21:30 (winter)
    - cron: "30 5 * * *"   # 08:30 Cairo (DST) / 07:30 (winter) — pre-open catch-up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit & push data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if [ -d data ]; then git add data; fi
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          DATE=$(python3 -c "import json;print(json.load(open('web/public/data/meta.json')).get('data_date') or 'n/a')")
          git commit -m "chore(data): scan for ${DATE}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
