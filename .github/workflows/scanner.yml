name: EGX Scanner

on:
  schedule:
    # Cairo is UTC+2 — EGX closes at 14:30 local. Run at 13:00 UTC = 15:00 Cairo (Sun-Thu)
    - cron: "0 13 * * 0,1,2,3,4"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Verify required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing GitHub Secrets: SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY."
            echo "Add them in: Settings → Secrets and variables → Actions"
            exit 2
          fi
          echo "Secrets present. SUPABASE_URL host: ${SUPABASE_URL#https://}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_PROXY_URL: ${{ secrets.CLOUDFLARE_PROXY_URL }}
          CLOUDFLARE_PROXY_TOKEN: ${{ secrets.CLOUDFLARE_PROXY_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python main.py
