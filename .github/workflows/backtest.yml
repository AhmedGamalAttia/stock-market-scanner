name: EGX Backtest

# Weekly re-evaluation of every strategy on the cached 5y price files.
# Writes web/public/data/backtest/*.json (incl. index.json whose "recommended"
# strategy the daily scanner follows) and commits them.
on:
  schedule:
    - cron: "0 6 * * 5"   # Friday 09:00 Cairo (market closed)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m tests.test_kalman
          python -m tests.test_positions

      - name: Run backtest
        env:
          PYTHONIOENCODING: utf-8
        run: python -m backtest.run

      - name: Commit & push
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/backtest
          if git diff --staged --quiet; then
            echo "No backtest changes."
            exit 0
          fi
          git commit -m "chore(backtest): weekly re-evaluation"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
